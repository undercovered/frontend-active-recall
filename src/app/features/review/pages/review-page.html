<header class="page-header">
  <h1>Repasar</h1>
  <p>Aquí realizarás la sesión de repaso con las preguntas que tocan hoy.</p>
</header>

<p-card styleClass="review-preview">
  <h2>Vista previa del motor de repaso</h2>
  <p class="review-preview__q">
    Cuando exista una sesión, verás aquí la pregunta y, tras responder, valorarás
    tu recuerdo con estos botones:
  </p>

  <div class="feedback">
    <button class="feedback__btn feedback__btn--again" type="button" disabled>
      Otra vez
    </button>
    <button class="feedback__btn feedback__btn--hard" type="button" disabled>
      Difícil
    </button>
    <button class="feedback__btn feedback__btn--good" type="button" disabled>
      Bien
    </button>
    <button class="feedback__btn feedback__btn--easy" type="button" disabled>
      Fácil
    </button>
  </div>

  <small>Próximamente: motor de repaso con repetición espaciada.</small>
</p-card>
