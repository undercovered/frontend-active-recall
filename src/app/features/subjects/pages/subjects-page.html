<div class="subjects">
  <header class="page-header page-header--row">
    <div>
      <h1>Materias</h1>
      <p>Organiza tus áreas de estudio.</p>
    </div>
    <p-button label="Nueva materia" icon="pi pi-plus" (onClick)="openCreate()" />
  </header>

  <div class="toolbar">
    <span class="search-box">
      <i class="pi pi-search"></i>
      <input
        pInputText
        type="text"
        placeholder="Buscar por nombre..."
        [ngModel]="search()"
        (ngModelChange)="onSearch($event)"
      />
    </span>
    @if (store.loading()) {
      <span class="text-small"><i class="pi pi-spin pi-spinner"></i> Cargando...</span>
    }
  </div>

  <div class="table-scroll">
    <p-table
      [value]="store.subjects()"
      styleClass="subjects-table"
      [tableStyle]="{ 'min-width': '32rem' }"
    >
    <ng-template #header>
      <tr>
        <th style="width: 30%">Título</th>
        <th>Descripción</th>
        <th style="width: 7rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-subject>
      <tr>
        <td>
          <a class="subject-link" [routerLink]="['/subjects', subject.id, 'topics']">
            {{ subject.title }}
          </a>
        </td>
        <td>
          @if (subject.description) {
            <div class="rich-text cell-desc" [innerHTML]="subject.description"></div>
          } @else {
            <span class="text-muted">—</span>
          }
        </td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-pencil"
              severity="secondary"
              [text]="true"
              (onClick)="openEdit(subject)"
            />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              (onClick)="remove(subject)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="empty">Aún no hay materias. Crea la primera.</td>
      </tr>
    </ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  [header]="editingId() ? 'Editar materia' : 'Nueva materia'"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [style]="{ width: '40rem' }"
  [breakpoints]="{ '640px': '95vw' }"
>
  <div class="form-field">
    <label for="title">Título</label>
    <input
      pInputText
      id="title"
      [ngModel]="form().title"
      (ngModelChange)="updateTitle($event)"
      placeholder="Ej. Matemáticas"
      autocomplete="off"
    />
  </div>

  <div class="form-field">
    <label>Descripción (opcional)</label>
    <p-editor [(ngModel)]="descriptionModel" [style]="{ height: '200px' }" />
  </div>

  @if (saveError()) {
    <p class="form-error">{{ saveError() }}</p>
  }

  <ng-template #footer>
    <p-button
      label="Cancelar"
      severity="secondary"
      [text]="true"
      [disabled]="store.saving()"
      (onClick)="dialogVisible.set(false)"
    />
    <p-button
      label="Guardar"
      icon="pi pi-check"
      [loading]="store.saving()"
      (onClick)="save()"
    />
  </ng-template>
</p-dialog>
