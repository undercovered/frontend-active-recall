<header class="page-header page-header--row">
  <div>
    <h1>Materias</h1>
    <p>Organiza tus áreas de estudio.</p>
  </div>
  <p-button label="Nueva materia" icon="pi pi-plus" (onClick)="openCreate()" />
</header>

<p-table [value]="store.subjects()" [tableStyle]="{ 'min-width': '40rem' }">
  <ng-template #header>
    <tr>
      <th>Título</th>
      <th>Descripción</th>
      <th style="width: 8rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-subject>
    <tr>
      <td>{{ subject.title }}</td>
      <td>{{ subject.description || '—' }}</td>
      <td>
        <div class="row-actions">
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            (onClick)="openEdit(subject)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            (onClick)="remove(subject)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="3" class="empty">Aún no hay materias. Crea la primera.</td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [header]="editingId() ? 'Editar materia' : 'Nueva materia'"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [style]="{ width: '30rem' }"
>
  <div class="form-field">
    <label for="title">Título</label>
    <input
      pInputText
      id="title"
      [ngModel]="form().title"
      (ngModelChange)="updateTitle($event)"
      placeholder="Ej. Matemáticas"
      autocomplete="off"
    />
  </div>

  <div class="form-field">
    <label for="description">Descripción (opcional)</label>
    <textarea
      pTextarea
      id="description"
      [ngModel]="form().description"
      (ngModelChange)="updateDescription($event)"
      rows="3"
    ></textarea>
  </div>

  @if (saveError()) {
    <p class="form-error">{{ saveError() }}</p>
  }

  <ng-template #footer>
    <p-button
      label="Cancelar"
      severity="secondary"
      [text]="true"
      [disabled]="store.saving()"
      (onClick)="dialogVisible.set(false)"
    />
    <p-button
      label="Guardar"
      icon="pi pi-check"
      [loading]="store.saving()"
      (onClick)="save()"
    />
  </ng-template>
</p-dialog>
